name: Contract and clean-install checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              venv.EnvBuilder(with_pip=True).create(root / 'venv')
              py = root / 'venv' / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(py), '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)
              subprocess.run([str(py), '-I', '-m', 'relatiobench', 'demo', '--output', str(root / 'demo')], cwd=root, check=True)
