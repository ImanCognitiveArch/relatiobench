name: Verify public preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published pages over HTTPS
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          base = "https://imancognitivearch.github.io/relatiobench/"
          checks = []
          for path, expected in [("", "Find the moment."), ("chat-demo/before/index.html", "POST_WITHDRAWAL_ACTION"), ("chat-demo/after/index.html", "No violations")]:
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  body = response.read().decode("utf-8")
                  assert response.status == 200
                  assert expected in body, path
                  checks.append({"url": base + path, "status": response.status, "content_verified": True})
          print(json.dumps({"checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(), "checks": checks}, indent=2))
          PY
